[project]
name = "jevemu"
version = "0.0.1"
description = "Emulate TypeSafe's Jev System One API on a vLLM-served open model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sinan Karaveli", email = "sinankaraveli@gmail.com" }]
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "jinja2>=3.1",
    "tenacity>=8.2",
    "anyio>=4.3",
    "pyarrow>=15",
    "pyyaml>=6",
    "typer>=0.12",
    "huggingface-hub>=0.34",
]

[project.optional-dependencies]
vllm = ["vllm==0.30.0"]
plot = ["matplotlib>=3.8", "pandas>=2.1", "seaborn>=0.13"]

[project.scripts]
jevemu = "jevemu.cli:app"

[project.urls]
Repository = "https://github.com/sinkarusa/jevemu"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevemu"]

[tool.hatch.build.targets.sdist]
exclude = ["third_party", "benchmarks/runs", ".github"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "cpu: needs a local vLLM server on CPU (nightly)",
    "gpu: needs a GPU vLLM server (on demand)",
    "live_jev: calls the real Jev API (manual, costs money)",
]
